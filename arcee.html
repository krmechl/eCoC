<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcee CoC Tracker | Blockchain Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- PDF.js for PDF rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- jsPDF for generating sample PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyber-blue': '#00d4ff',
                        'cyber-dark': '#0a192f',
                        'paper-gray': '#f5f5f0',
                        'accent': '#6366f1'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Styles & Overrides */
        body {
            background-color: #f8fafc;
            color: #1e293b;
        }
        
        /* Tooltip Styles */
        .tooltip {
            position: relative;
        }
        
        .tooltip .tooltiptext {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            margin-left: -100px; /* Center horizontally */
            width: 200px;
            padding: 5px 0;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            font-size: 12px;
        }
        
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Modal Backdrop */
        .modal-backdrop {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(90deg, #6366f1, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* PDF Viewer Styles */
        #pdf-render-canvas {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            height: auto;
        }

        .pdf-placeholder {
            background: #f9fafb;
            border: 2px dashed #e5e7eb;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            color: #64748b;
        }

        .pdf-placeholder i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }

        /* Loading spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #00d4ff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* GitHub file list dropdown */
        .github-file-select {
            appearance: none;
            background-color: white;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%20viewBox%3D%220%200%20292.4%20292.4%22%20fill%3D%22%23cbd5e1%22%3E%3Cpath%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.2A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.2%2012.9l128%20127.9c3.6%203.6%207.9%205.2%2012.2%205.2%204.3%200%208.6-1.6%2011.8-5.2l128-127.9c3.6-3.6%205.2-7.9%205.2-12.9%200-5-1.6-9.3-5.2-12.9zM18.4%20182.2H87l-88.7-88.7C18.9%2093.2%2018.4%2088.4%2018.4%2083.2%20c0-5%201.8-9.3%205.2-12.9l128-127.9c2.2-2.2%204.8-3.3%207.2-3.3%202.4%200%204.9%201.1%207.2%203.3l128%20127.9c3.6%203.6%205.2%207.9%205.2%2012.9%200%205-1.6%209.3-5.2%2012.9L74.5%20182.2H18.4z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
            padding-right: 36px;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <!-- Navigation Bar -->

    <!-- Main Layout -->

                        <span class="font-medium">Dashboard</span>
                    </button>
                    <button onclick="navigateTo('field-jobs')" id="nav-field-jobs" class="nav-btn w-full px-4 py-3 rounded-lg flex items-center gap-3 text-gray-600 hover:bg-gray-50 hover:text-cyber-blue transition group">
                        <i class="fa-solid fa-clipboard-list w-5 text-center group-hover:text-cyber-blue"></i>
                        <span class="font-medium">Field Jobs</span>
                    </button>
                    <button onclick="navigateTo('ledgers')" id="nav-ledgers" class="nav-btn w-full px-4 py-3 rounded-lg flex items-center gap-3 text-gray-600 hover:bg-gray-50 hover:text-cyber-blue transition group">

                    <button onclick="navigateTo('settings')" id="nav-settings" class="nav-btn w-full px-4 py-3 rounded-lg flex items-center gap-3 text-gray-600 hover:bg-gray-50 hover:text-cyber-blue transition group">
                        <i class="fa-solid fa-gear w-5 text-center group-hover:text-cyber-blue"></i>
                        <span class="font-medium">Settings</span>
                    </button>
                </nav>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 md:p-8 bg-paper-gray min-h-screen">
            
            <!-- Dynamic Content Container -->
            <div id="app-content" class="max-w-6xl mx-auto">
                <!-- Content will be rendered here by JavaScript -->
            </div>

        </main>
    </div>

    <!-- Scan CoC Modal -->
    <div id="scan-coc-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4 hidden modal-backdrop">
        <div class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b flex items-center justify-between gap-3">
                <div>
                    <h3 class="text-2xl font-bold gradient-text">Scan Chain of Custody</h3>
                    <p class="text-gray-600 mt-1">Upload and verify a paper CoC document</p>
                </div>
                <button type="button" id="close-scan-coc-modal" class="text-gray-500 hover:text-gray-800 text-xl">&times;</button>
            </div>
            
            <div class="p-6 space-y-6">
                <!-- PDF Preview Section -->
                <div class="space-y-4">
                    <h4 class="font-semibold text-lg">Document Preview</h4>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center bg-gray-50">
                        <div id="pdf-placeholder" class="pdf-placeholder">
                            <i class="fa-solid fa-file-pdf"></i>
                            <p>PDF will appear here</p>
                            <p class="text-sm text-gray-500 mt-2">Simulated scan of paper CoC</p>
                        </div>
                        <div id="pdf-render-container" class="hidden w-full h-auto flex justify-center">
                            <canvas id="pdf-render-canvas"></canvas>
                        </div>
                        <div id="pdf-loading" class="hidden flex justify-center items-center mt-4">
                            <div class="spinner"></div>
                        </div>
                    </div>
                    
                    <!-- File Upload & GitHub Options -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- File Upload -->
                        <div>
                            <label class="block text-sm font-medium mb-2">Select PDF File</label>
                            <div class="border-2 border-dashed border-blue-500 rounded-lg p-4 text-center hover:bg-blue-50 transition">
                                <input type="file" id="coc-pdf-upload" accept=".pdf" class="hidden">
                                <label for="coc-pdf-upload" class="cursor-pointer">
                                    <i class="fa-solid fa-cloud-arrow-up text-blue-600 text-xl mb-2"></i>
                                    <p class="text-sm font-medium">Click to upload PDF</p>
                                    <p class="text-xs text-gray-500">from your device</p>
                                </label>
                            </div>
                        </div>
                        
                        <!-- GitHub Repository Files -->
                        <div>
                            <label class="block text-sm font-medium mb-2">GitHub Repository Files</label>
                            <div class="border-2 border-dashed border-green-500 rounded-lg p-4 text-center hover:bg-green-50 transition">
                                <button id="load-github-pdf" class="w-full px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 flex items-center justify-center gap-2">
                                    <i class="fa-brands fa-github text-lg text-green-600"></i>
                                    <span>Load from GitHub</span>
                                </button>
                                <div id="github-file-list" class="hidden mt-4">
                                    <select id="github-pdf-select" class="github-file-select w-full form-input rounded-lg px-3 py-2 mt-2">
                                        <option value="">Loading files from GitHub...</option>
                                    </select>
                                    <div class="flex items-center justify-between mt-2">

                                    </div>

                        <!-- Sample CoC -->

                        </div>
                    </div>
                </div>
                
                <!-- Dynamic Data Entry -->
                <div class="space-y-4 border-t pt-6">
                    <h4 class="font-semibold text-lg">Activity Details</h4>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Timestamp</label>
                            <div class="flex items-center gap-2">
                                <input type="text" id="coc-timestamp" readonly class="w-full form-input rounded-lg px-3 py-2 bg-gray-100" value="">

                                    <i class="fa-solid fa-refresh"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">GPS Location</label>
                            <div class="flex items-center gap-2">
                                <input type="text" id="coc-gps" readonly class="w-full form-input rounded-lg px-3 py-2 bg-gray-100" value="40.4406° N, 79.9959° W">
                                <button id="refresh-gps" class="px-3 py-2 rounded bg-gray-100 hover:bg-gray-200 text-gray-600" title="Refresh GPS">
                                    <i class="fa-solid fa-location-crosshairs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2">Activity Description</label>
                        <textarea id="coc-description" class="w-full form-input rounded-lg px-3 py-2" rows="3" placeholder="Describe what's happening with this CoC (e.g., 'Samples transferred to FedEx, tracking #123456')"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Signer</label>
                            <input type="text" id="coc-signer" class="w-full form-input rounded-lg px-3 py-2" placeholder="Your name">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">Recipient</label>
                            <input type="text" id="coc-recipient" class="w-full form-input rounded-lg px-3 py-2" placeholder="Who received the samples">
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between pt-4 border-t">
                        <button type="button" id="cancel-scan-coc" class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 font-medium transition">
                            Cancel
                        </button>
                        <button type="button" id="submit-scan-coc" class="px-5 py-2 rounded-lg bg-gradient-to-r from-green-600 to-teal-700 text-white font-medium transition">
                            <i class="fa-solid fa-check mr-2"></i> Submit Scan
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- View Ledgers Modal (Simplified for prototype) -->
    <div id="view-ledgers-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4 hidden modal-backdrop">
        <div class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-6xl max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b flex items-center justify-between gap-3">
                <div>
                    <h3 class="text-2xl font-bold gradient-text">Blockchain Ledger</h3>
                    <p class="text-gray-600 mt-1">View all transactions and CoC scans</p>
                </div>
                <button type="button" id="close-ledgers-modal" class="text-gray-500 hover:text-gray-800 text-xl">&times;</button>
            </div>
            <div class="p-6">
                <div class="mb-4 flex justify-between items-center">
                    <h4 class="text-lg font-semibold">Recent Entries</h4>
                    <button onclick="closeModal('view-ledgers-modal')" class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm">Close</button>
                </div>
                <div id="blockchain-entries-container" class="space-y-3">
                    <!-- Entries will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // ==========================================
        // PDF.JS SETUP
        // ==========================================
        let pdfjsLibLoaded = false;
        
        function loadPDFJS() {
            if (pdfjsLibLoaded) return;
            
            // Set the worker source
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            pdfjsLibLoaded = true;
        }

        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        const state = {
            currentView: 'dashboard',
            jobs: [
                {
                    id: 'JOB001',
                    customer: 'Acme Corp',
                    type: 'Soil Analysis',
                    status: 'pending',
                    pickupDate: '2023-10-25',
                    location: 'Pittsburgh, PA',
                    fieldAgent: 'Mark D.'
                },
                {
                    id: 'JOB002',
                    customer: 'TechStart Inc.',
                    type: 'Water Quality',
                    status: 'in_transit',
                    pickupDate: '2023-10-26',
                    location: 'San Francisco, CA',
                    fieldAgent: 'Sarah J.'
                },
                {
                    id: 'JOB003',
                    customer: 'Global Industries',
                    type: 'Chemical Profiling',
                    status: 'completed',
                    pickupDate: '2023-10-20',
                    location: 'Houston, TX',
                    fieldAgent: 'Mike T.'
                }
            ],
            fieldJobs: [
                {
                    id: 'FJ-101',
                    jobId: 'JOB001',
                    status: 'pending_pickup',
                    location: 'Pittsburgh Office',
                    lastUpdated: '2023-10-24 14:30'
                },
                {
                    id: 'FJ-102',
                    jobId: 'JOB002',
                    status: 'in_transit',
                    location: 'I-5 Corridor',
                    lastUpdated: '2023-10-25 09:15'
                }
            ],
            blockchain: [
                {
                    index: 0,
                    hash: '0x' + 'a1b2c3d4e5f6'.toUpperCase(),
                    timestamp: '2023-10-20 08:00',
                    title: 'Genesis Block',
                    text: 'Initial setup of the Arcee CoC blockchain',
                    status: 'confirmed'
                },
                {
                    index: 1,
                    hash: '0x' + 'b2c3d4e5f6a1'.toUpperCase(),
                    timestamp: '2023-10-20 10:30',
                    title: 'Job Created',
                    text: 'JOB003 created for Global Industries',
                    status: 'confirmed'
                },
                {
                    index: 2,
                    hash: '0x' + 'c3d4e5f6a1b2'.toUpperCase(),
                    timestamp: '2023-10-20 14:00',
                    title: 'Sample Pickup',
                    text: 'Field agent Mike T. picked up samples from Houston, TX',
                    status: 'confirmed'
                }
            ],
            // Store CoC scans for this session
            cocScans: [],
            // Mock transactions for stats
            transactions: [
                { hash: '0x' + 'abc123'.toUpperCase(), type: 'pickup', amount: 0, status: 'confirmed', time: '2023-10-20 10:30', currency: 'USD' },
                { hash: '0x' + 'def456'.toUpperCase(), type: 'analysis', amount: 150, status: 'confirmed', time: '2023-10-21 09:00', currency: 'USD' },
                { hash: '0x' + 'ghi789'.toUpperCase(), type: 'transfer', amount: 0, status: 'confirmed', time: '2023-10-22 16:45', currency: 'USD' }
            ]
        };

        // ==========================================
        // GITHUB API SETUP
        // ==========================================
        const GITHUB_REPO = 'krmechl/eCoC';
        const GITHUB_API_URL = 'https://api.github.com/repos/';
        const GITHUB_CACHE_KEY = 'github-pdfs-cache';

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================
        function generateHash(prefix) {
            // Simple mock hash generator
            return '0x' + Array(8).fill(0).map(() => Math.floor(Math.random() * 16).toString(16)).join('').toUpperCase();
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // Icon based on type
            const icon = type === 'success' ? 'fa-circle-check text-green-500' : 'fa-circle-exclamation text-red-500';
            
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg shadow-md transform transition-all translate-y-10 opacity-0 bg-white border-l-4 ${
                type === 'success' ? 'border-green-500' : 'border-red-500'
            }`;
            toast.innerHTML = `
                <i class="fa-solid ${icon}"></i>
                <span class="font-medium text-sm">${message}</span>
            `;
            
            container.appendChild(toast);
            
            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 10);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Hash copied to clipboard!');
            });
        }

        // ==========================================
        // NAVIGATION
        // ==========================================
        function navigateTo(viewName) {
            state.currentView = viewName;
            
            // Update sidebar active state
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-gray-100', 'text-cyber-blue', 'border-r-2', 'border-cyber-blue');
                btn.classList.add('text-gray-600');
            });
            
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-gray-600');
                activeBtn.classList.add('bg-gray-100', 'text-cyber-blue', 'border-r-2', 'border-cyber-blue');
            }
            
            // Render the view
            renderView();
        }

        function renderView() {
            const contentContainer = document.getElementById('app-content');
            
            switch (state.currentView) {
                case 'dashboard':
                    contentContainer.innerHTML = renderDashboard();
                    break;
                case 'field-jobs':
                    contentContainer.innerHTML = renderFieldJobs();
                    break;
                case 'ledgers':
                    contentContainer.innerHTML = renderLedgers();
                    break;
                case 'settings':
                    contentContainer.innerHTML = renderSettings();
                    break;
                default:
                    contentContainer.innerHTML = renderDashboard();
            }
        }

        // ==========================================
        // VIEW RENDERERS
        // ==========================================
        function renderDashboard() {
            const totalJobs = state.jobs.length;
            const pendingJobs = state.jobs.filter(j => j.status === 'pending').length;
            const inTransitJobs = state.jobs.filter(j => j.status === 'in_transit').length;
            const totalRevenue = state.transactions.reduce((sum, t) => sum + t.amount, 0);
            
            return `
                <div class="space-y-8">
                    <!-- Header -->
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900">Dashboard</h1>
                        <p class="text-gray-600 mt-2">Real-time overview of your chain of custody operations.</p>

        // ==========================================

        async function fetchGitHubPDFs() {
            try {
                // Check if we have a cached version and if it's less than 1 hour old
                const cached = localStorage.getItem(GITHUB_CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    const age = Date.now() - data.timestamp;
                    // If cache is less than 1 hour old, use it
                    if (age < 3600000) {
                        populateGitHubDropdown(data.pdfs);
                        return;
                    }
                }

                // If we get here, we need to fetch fresh data
                showToast('Fetching fresh PDF list from GitHub...', 'info');

                const response = await fetch(`${GITHUB_API_URL}${GITHUB_REPO}/contents`, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'User-Agent': 'eCoC-App'
                    }
                });

                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }

                const data = await response.json();
                
                // Filter for PDF files
                const pdfs = data.filter(item => item.name.toLowerCase().endsWith('.pdf'));
                
                // Cache the result for 1 hour (3600000 ms)
                localStorage.setItem(GITHUB_CACHE_KEY, JSON.stringify({
                    timestamp: Date.now(),
                    pdfs: pdfs
                }));

                populateGitHubDropdown(pdfs);
            } catch (error) {
                console.error('Error fetching GitHub files:', error);
                showToast('Failed to fetch PDF list from GitHub. Please try again.', 'error');
            }
        }

        function refreshGitHubPDFs() {
            // Clear the cache
            localStorage.removeItem(GITHUB_CACHE_KEY);
            // Show loading state
            const select = document.getElementById('github-pdf-select');
            select.innerHTML = '<option value="">Refreshing files from GitHub...</option>';
            // Fetch fresh data
            fetchGitHubPDFs();
            showToast('GitHub file list refreshed!');
        }

        function populateGitHubDropdown(pdfs) {
            const select = document.getElementById('github-pdf-select');
            select.innerHTML = '<option value="">Select a PDF from repository...</option>';
            
            if (pdfs.length === 0) {
                select.innerHTML += '<option value="" disabled>No PDF files found</option>';
            } else {
                pdfs.forEach(pdf => {
                    const option = document.createElement('option');
                    option.value = pdf.download_url;
                    option.textContent = pdf.name;
                    select.appendChild(option);
                });
            }
            
            // Show the dropdown and hide the load button
            document.getElementById('load-github-pdf').classList.add('hidden');
            document.getElementById('github-file-list').classList.remove('hidden');
        }

        async function loadPDFFromGitHub(url) {
            try {
                // Show loading indicator
                document.getElementById('pdf-loading').classList.remove('hidden');

                renderPDF(blob);
                showToast('PDF loaded from GitHub!');

                showToast('Failed to load PDF from GitHub. Please try again.', 'error');

        async function loadSampleCoC() {
            // Show loading indicator
            document.getElementById('pdf-loading').classList.remove('hidden');

            try {
                // Use jsPDF to generate a sample PDF

                doc.setFontSize(12);
                doc.text('This is a sample CoC document for demonstration purposes.', 20, 40);
                doc.text('Date: ' + new Date().toLocaleDateString(), 20, 60);
                doc.text('Field Agent: Mark D.', 20, 80);
                doc.text('GPS Location: 40.4406° N, 79.9959° W', 20, 100);
                doc.text('Samples: Soil, Water, Air', 20, 120);
                doc.text('Description: Routine environmental monitoring.', 20, 140);
                doc.text('Signature: _________________________', 20, 160);

                // Get the PDF as an ArrayBuffer
                const arrayBuffer = doc.output('arraybuffer');

                // Convert to blob
                const blob = new Blob([arrayBuffer], { type: 'application/pdf' });

                renderPDF(blob);
                showToast('Sample CoC generated!');
            } catch (error) {
                console.error('Error generating sample PDF:', error);
                showToast('Error generating sample PDF. Please try uploading your own PDF.', 'error');

                document.getElementById('pdf-placeholder').classList.remove('hidden');

        async function renderPDF(file) {
            // Ensure PDF.js is loaded
            loadPDFJS();
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const typedarray = new Uint8Array(e.target.result);
                    const loadingTask = pdfjsLib.getDocument(typedarray);
                    const pdf = await loadingTask.promise;
                    
                    // Render first page
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({ scale: 1.5 }); // Scale for better visibility
                    
                    const canvas = document.getElementById('pdf-render-canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    await page.render(renderContext).promise;
                    
                    // Show canvas, hide placeholder and loading
                    document.getElementById('pdf-placeholder').classList.add('hidden');
                    document.getElementById('pdf-render-container').classList.remove('hidden');
                    document.getElementById('pdf-loading').classList.add('hidden');
                    
                    showToast('PDF rendered successfully!');
                } catch (error) {
                    console.error('Error rendering PDF:', error);
                    showToast('Error rendering PDF. Please try a different file.', 'error');
                    document.getElementById('pdf-loading').classList.add('hidden');
                    document.getElementById('pdf-placeholder').classList.remove('hidden');
                }
            };
            reader.readAsArrayBuffer(file);
        }

                        backdrop.classList.add('hidden');
                    }
                });
            });
            
            // Check for cached GitHub PDFs and show if available
            const cached = localStorage.getItem(GITHUB_CACHE_KEY);
            if (cached) {
                const data = JSON.parse(cached);
                // Check if cache is less than 1 hour old
                if (Date.now() - data.timestamp < 3600000) {
                    populateGitHubDropdown(data.pdfs);
                }
            }
        });

    </script>
</body>
</html>
